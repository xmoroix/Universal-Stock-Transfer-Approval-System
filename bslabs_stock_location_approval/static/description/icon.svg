<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="128" fill="#2E7D32" rx="16"/>

  <!-- Box/Location Icon -->
  <g transform="translate(24, 28)">
    <!-- Box -->
    <path d="M 40 10 L 72 25 L 72 60 L 40 75 L 8 60 L 8 25 Z"
          fill="#81C784" stroke="#1B5E20" stroke-width="2"/>
    <!-- Box top -->
    <path d="M 40 10 L 72 25 L 40 40 L 8 25 Z"
          fill="#A5D6A7" stroke="#1B5E20" stroke-width="2"/>
    <!-- Box front left -->
    <path d="M 8 25 L 8 60 L 40 75 L 40 40 Z"
          fill="#66BB6A" stroke="#1B5E20" stroke-width="2"/>
  </g>

  <!-- Checkmark/Approval Icon -->
  <g transform="translate(68, 68)">
    <!-- Circle background -->
    <circle cx="20" cy="20" r="18" fill="#4CAF50" stroke="#1B5E20" stroke-width="2"/>
    <!-- Checkmark -->
    <path d="M 12 20 L 18 26 L 30 14"
          fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
